openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Contact form operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit contact form
      description: Submit a contact form message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Message submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSubmission"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ContactInput:
      type: object
      required:
        - fullName
        - email
        - inquiryType
        - message
        - privacyConsent
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 200
        organization:
          type: ["string", "null"]
        email:
          type: string
        phone:
          type: ["string", "null"]
        country:
          type: ["string", "null"]
        inquiryType:
          type: string
          enum:
            - industrial_pilot
            - research_collaboration
            - join_the_team
            - incubator_or_program
            - investor_conversation
            - general_inquiry
        message:
          type: string
          minLength: 10
          maxLength: 5000
        privacyConsent:
          type: boolean
        honeypot:
          type: ["string", "null"]
    ContactSubmission:
      type: object
      required:
        - id
        - fullName
        - email
        - inquiryType
        - createdAt
      properties:
        id:
          type: integer
        fullName:
          type: string
        email:
          type: string
        inquiryType:
          type: string
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
